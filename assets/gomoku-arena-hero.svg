<g stroke="#3c210d" stroke-opacity=".75" stroke-width="3">
 <path d="M265 760L800 1035 1335 760M400 730L800 940 1200 730M535 697L800 840 1065 697M670 665L800 735 930 665"/>
 <path d="M300 875L1300 875M430 940L1170 940M560 1005L1040 1005"/>
</g>
<!-- go stones -->
<g stroke="#c5d6f2" stroke-opacity=".35" stroke-width="3">
 <ellipse cx="480" cy="858" rx="52" ry="25" fill="url(#blackStone)"/>
 <ellipse cx="720" cy="925" rx="51" ry="24" fill="url(#whiteStone)"/>
 <ellipse cx="930" cy="840" rx="54" ry="26" fill="url(#blackStone)"/>
 <ellipse cx="1120" cy="900" rx="51" ry="24" fill="url(#whiteStone)"/>
 <ellipse cx="1260" cy="820" rx="46" ry="22" fill="url(#blackStone)"/>
 <ellipse cx="350" cy="940" rx="48" ry="23" fill="url(#whiteStone)"/>
</g>
<!-- luminous stage edge -->
<path d="M130 790L800 1120 1470 790" fill="none" stroke="#ffc84d" stroke-width="8" opacity=".9" filter="url(#shine)"/>
<path d="M130 790L800 1120 1470 790" fill="none" stroke="#fff0a2" stroke-width="2" opacity=".85"/>
<g fill="#ffd76b"><circle cx="130" cy="790" r="10"/><circle cx="1470" cy="790" r="10"/><circle cx="800" cy="1120" r="11"/></g>
</svg>