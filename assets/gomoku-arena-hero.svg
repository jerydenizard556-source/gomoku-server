<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#020817"/><stop offset=".48" stop-color="#071c43"/><stop offset="1" stop-color="#020611"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#2c82ff" stop-opacity=".9"/><stop offset="1" stop-color="#1260e8" stop-opacity="0"/></radialGradient>
 <radialGradient id="gold"><stop stop-color="#fff4b0"/><stop offset=".32" stop-color="#ffc84a"/><stop offset="1" stop-color="#d17a09" stop-opacity="0"/></radialGradient>
 <linearGradient id="goldMetal" x2="0" y2="1"><stop stop-color="#fff2a2"/><stop offset=".22" stop-color="#ffc83d"/><stop offset=".52" stop-color="#a85b08"/><stop offset=".76" stop-color="#ffdf72"/><stop offset="1" stop-color="#6d3907"/></linearGradient>
 <linearGradient id="board" x2="0" y2="1"><stop stop-color="#d99a3a"/><stop offset=".5" stop-color="#8b4e17"/><stop offset="1" stop-color="#2b160b"/></linearGradient>
 <radialGradient id="blackStone" cx=".3" cy=".22"><stop stop-color="#a7c7ff"/><stop offset=".12" stop-color="#273b5d"/><stop offset=".5" stop-color="#07101e"/><stop offset="1" stop-color="#000207"/></radialGradient>
 <radialGradient id="whiteStone" cx=".3" cy=".2"><stop stop-color="#fff"/><stop offset=".4" stop-color="#dbeaff"/><stop offset=".8" stop-color="#879bb8"/><stop offset="1" stop-color="#26354c"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
 <filter id="shadow"><feGaussianBlur stdDeviation="16"/></filter>
 <filter id="shine"><feGaussianBlur stdDeviation="5"/></filter>
 <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#2a1a0c" stroke-opacity=".65" stroke-width="2"/></pattern>
</defs>
<rect width="1600" height="1200" fill="url(#bg)"/>
<ellipse cx="800" cy="390" rx="700" ry="390" fill="url(#glow)" opacity=".8"/>
<ellipse cx="800" cy="820" rx="700" ry="300" fill="url(#gold)" opacity=".24"/>
