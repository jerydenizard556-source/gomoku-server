<path d="M0 170Q800 -90 1600 170V650Q800 390 0 650Z" fill="#07142b" stroke="#174c9d" stroke-width="5"/>
<path d="M0 245Q800 0 1600 245M0 315Q800 80 1600 315M0 390Q800 165 1600 390M0 470Q800 245 1600 470" fill="none" stroke="#1b5fbb" stroke-opacity=".55" stroke-width="12"/>
<path d="M0 520Q800 275 1600 520" fill="none" stroke="#ffca53" stroke-opacity=".45" stroke-width="3"/>
<g fill="#4aa2ff" opacity=".9"><path d="M90 110l-70 210h32l70-210zM350 15l-58 180h27L377 15zM1250 15l58 180h-27L1223 15zM1510 110l70 210h-32l-70-210z"/></g>
<g fill="#e7f4ff" opacity=".85"><ellipse cx="95" cy="125" rx="42" ry="9" transform="rotate(-18 95 125)"/><ellipse cx="350" cy="42" rx="36" ry="8" transform="rotate(-18 350 42)"/><ellipse cx="1250" cy="42" rx="36" ry="8" transform="rotate(18 1250 42)"/><ellipse cx="1505" cy="125" rx="42" ry="9" transform="rotate(18 1505 125)"/></g>
<g fill="#ffbf36" opacity=".75"><circle cx="110" cy="360" r="5"/><circle cx="190" cy="335" r="4"/><circle cx="300" cy="310" r="5"/><circle cx="1300" cy="310" r="5"/><circle cx="1410" cy="335" r="4"/><circle cx="1490" cy="360" r="5"/></g>
<!-- golden championship halo -->
<ellipse cx="800" cy="640" rx="590" ry="190" fill="none" stroke="#ffca4d" stroke-opacity=".16" stroke-width="42"/>
<ellipse cx="800" cy="640" rx="520" ry="150" fill="none" stroke="#ffd46b" stroke-opacity=".55" stroke-width="4"/>
<path d="M170 660Q800 390 1430 660" fill="none" stroke="#fff0a3" stroke-opacity=".7" stroke-width="3"/>
<g fill="#ffd15a"><circle cx="225" cy="635" r="8"/><circle cx="1375" cy="635" r="8"/><circle cx="800" cy="490" r="7"/></g>
<!-- floating gold particles -->
<g fill="#ffd56b"><circle cx="260" cy="510" r="4"/><circle cx="340" cy="600" r="3"/><circle cx="1260" cy="500" r="4"/><circle cx="1350" cy="585" r="3"/><circle cx="520" cy="420" r="3"/><circle cx="1080" cy="420" r="3"/><circle cx="800" cy="330" r="4"/></g>
<!-- tournament board platform -->
<ellipse cx="800" cy="1040" rx="670" ry="95" fill="#000" opacity=".72" filter="url(#shadow)"/>
<path d="M130 790L800 635l670 155-670 330Z" fill="url(#board)" stroke="#ffce5c" stroke-width="9"/>
<path d="M130 790L800 635l670 155-670 330Z" fill="url(#grid)" opacity=".9"/>
<path d="M130 790L800 635l670 155-670 330Z" fill="none" stroke="#ffe18a" stroke-opacity=".6" stroke-width="3"/>
<path d="M130 790L130 845l670 355 670-355v-55l-670 330Z" fill="#241306" stroke="#9b5c1c" stroke-width="7"/>
