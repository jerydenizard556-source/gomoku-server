name: Isolated Gomoku database smoke test

on:
  push:
    branches:
      - test/render-isolated
  pull_request:
    branches:
      - main

jobs:
  gomoku-postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gomoku_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gomoku_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gomoku_test
      TOURNAMENT_PAYMENT_SECRET: ci-only-tournament-secret
      TOURNAMENT_ADMIN_SECRET: ci-only-admin-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Initialize isolated Gomoku schema
        run: |
          python - <<'PY'
          import server
          assert server.db is not None, "Gomoku did not connect to isolated PostgreSQL"
          with server.db.cursor() as cur:
              cur.execute(
                  "SELECT COUNT(*) FROM information_schema.tables "
                  "WHERE table_schema='public'"
              )
              count = cur.fetchone()[0]
          assert count >= 5, f"Expected Gomoku tables, found {count}"
          print(f"Gomoku database smoke test passed ({count} tables).")
          PY
      - name: Compile Python sources
        run: python -m compileall -q server.py tournament_extension.py tests scripts
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
